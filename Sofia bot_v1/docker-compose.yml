version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: sofia_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sofia_burnout}
      POSTGRES_USER: ${POSTGRES_USER:-sofia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofia_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sofia_user} -d ${POSTGRES_DB:-sofia_burnout}"]
      interval: 10s
      timeout: 5s
      retries: 5

  nlp_service:
    build:
      context: ./nlp-service
      dockerfile: Dockerfile
    container_name: sofia_nlp
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sofia_burnout}
      POSTGRES_USER: ${POSTGRES_USER:-sofia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofia_password}
      NLP_API_PORT: 8000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  telegram_bot:
    build:
      context: ./telegram-bot
      dockerfile: Dockerfile
    container_name: sofia_telegram_bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      NLP_SERVICE_URL: http://nlp_service:8000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-sofia_burnout}
      POSTGRES_USER: ${POSTGRES_USER:-sofia_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sofia_password}
    ports:
      - "8080:8080"
    depends_on:
      nlp_service:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
